name: Build YZ Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Create YZ Android Project
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable-nodpi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'YZ-Android'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.yzalive.app.preview'
              compileSdk 36
              buildToolsVersion '35.0.0'

              defaultConfig {
                  applicationId 'com.yzalive.app.preview'
                  minSdk 24
                  targetSdk 35
                  versionCode 2
                  versionName '1.0.1-preview'
              }
          }

          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">YZ ALIVE</string>
              <string name="asset_statements" translatable="false">[{\"relation\":[\"delegate_permission/common.handle_all_urls\"],\"target\":{\"namespace\":\"web\",\"site\":\"https://yzalive.com\"}}]</string>
              <color name="yz_background">#F8F2FF</color>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/yz_icon"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:supportsRtl="true"
                  android:manageSpaceActivity="com.google.androidbrowserhelper.trusted.ManageDataLauncherActivity"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar">

                  <meta-data
                      android:name="asset_statements"
                      android:resource="@string/asset_statements"/>

                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.ManageDataLauncherActivity"
                      android:exported="false"
                      android:enabled="true"
                      android:excludeFromRecents="true">

                      <meta-data
                          android:name="android.support.customtabs.trusted.MANAGE_SPACE_URL"
                          android:value="https://yzalive.com/"/>

                      <intent-filter>
                          <action android:name="android.intent.action.APPLICATION_PREFERENCES"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                      </intent-filter>

                  </activity>

                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                      android:alwaysRetainTaskState="true"
                      android:exported="true">

                      <meta-data
                          android:name="android.support.customtabs.trusted.DEFAULT_URL"
                          android:value="https://yzalive.com/"/>

                      <meta-data
                          android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR"
                          android:resource="@color/yz_background"/>

                      <meta-data
                          android:name="android.support.customtabs.trusted.NAVIGATION_BAR_COLOR"
                          android:resource="@color/yz_background"/>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.FocusActivity"
                      android:exported="false"/>

              </application>
          </manifest>
          EOF

          curl --fail --location --max-time 60 --retry 2 \
            https://yzalive.com/yz-icon-512.png \
            -o app/src/main/res/drawable-nodpi/yz_icon.png

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          mkdir -p output

          cp app/build/outputs/apk/debug/app-debug.apk \
            output/YZ-ALIVE-Preview.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --print-certs output/YZ-ALIVE-Preview.apk \
            > output/certificate.txt

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump xmltree output/YZ-ALIVE-Preview.apk AndroidManifest.xml \
            > output/manifest-check.txt

          grep -q "com.google.androidbrowserhelper.trusted.ManageDataLauncherActivity" \
            output/manifest-check.txt

          cat output/certificate.txt
          sha256sum output/YZ-ALIVE-Preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YZ-ALIVE-Android
          path: output/
          retention-days: 7
          if-no-files-found: error
